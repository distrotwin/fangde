name: 构建镜像

# 下游仓库唯一的 workflow：只定义矩阵、调用 buildkit 的可复用 workflow。
# 只允许手动触发——真正需要的是「我要出一批镜像了」这个显式动作。
#
# 三代桌面线：v3.1（cdos/Mint 混血，glibc 2.24，仅 amd64）、panda（buster，
# 2.28，amd64+arm64）、tiger（bullseye，2.31，amd64+arm64）。tiger 的
# loongarch64 是旧世界 ABI，托管 runner 造不出来（判据见 buildkit
# docs/downstream-repo.md），不进矩阵。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "测试全绿后发布到 GHCR（默认不发布）"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { did: v3.1,  arch: amd64 }
          - { did: panda, arch: amd64 }
          - { did: panda, arch: arm64 }
          - { did: tiger, arch: amd64 }
          - { did: tiger, arch: arm64 }
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@6d88d822c9643f0b933e2b776f21fc50aea34e66
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  test:
    needs: [build]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { did: v3.1,  arch: amd64 }
          - { did: panda, arch: amd64 }
          - { did: panda, arch: arm64 }
          - { did: tiger, arch: amd64 }
          - { did: tiger, arch: arm64 }
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@6d88d822c9643f0b933e2b776f21fc50aea34e66
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  # tiger 实测 6 份 252 项；v3.1/panda 首轮按保守地板，绿后对齐
  report:
    needs: [test]
    if: always()
    uses: distrotwin/buildkit/.github/workflows/report.yml@6d88d822c9643f0b933e2b776f21fc50aea34e66
    with:
      distros:  '["v3.1","panda","tiger"]'
      expected: 15
      baseline: 560

  publish:
    needs: [test, report]
    if: inputs.publish && needs.test.result == 'success' && needs.report.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { did: v3.1,  prefix: v3.1,  tier: micro, arches: amd64,         latest: false }
          - { did: v3.1,  prefix: v3.1,  tier: base,  arches: amd64,         latest: false }
          - { did: v3.1,  prefix: v3.1,  tier: devel, arches: amd64,         latest: false }
          - { did: panda, prefix: panda, tier: micro, arches: "amd64 arm64", latest: false }
          - { did: panda, prefix: panda, tier: base,  arches: "amd64 arm64", latest: false }
          - { did: panda, prefix: panda, tier: devel, arches: "amd64 arm64", latest: false }
          - { did: tiger, prefix: tiger, tier: micro, arches: "amd64 arm64", latest: false }
          - { did: tiger, prefix: tiger, tier: base,  arches: "amd64 arm64", latest: false }
          # latest 指向最新一代（tiger）的 devel
          - { did: tiger, prefix: tiger, tier: devel, arches: "amd64 arm64", latest: true }
    uses: distrotwin/buildkit/.github/workflows/publish-one.yml@6d88d822c9643f0b933e2b776f21fc50aea34e66
    with:
      distro-id:  ${{ matrix.did }}
      tier:       ${{ matrix.tier }}
      image:      fangde
      tag-prefix: ${{ matrix.prefix }}
      arches:     ${{ matrix.arches }}
      latest:     ${{ matrix.latest }}
