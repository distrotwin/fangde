# 方德桌面 3.1 代（cdos 3.x 系）—— Linux Mint/Debian 9 混血，glibc 2.24 档 ABI
#
# 血统如实记：lsb-base 版本串是 4.1+Debian11ubuntu6mint1+1cdos2，gcc-6 是
# 6.2.1-7ubuntu3+2cdos2 —— Mint/Ubuntu 包直接混在 Debian 9 底盘里，os-release
# 自述 "cdos 3.0 x86_64 Release"。这一代 2021-04 定版、2022-01 停更。
#
# 取材：update.os 的 repo_desktop_3.1（pub/main 全量 + nfs/main+update 厂商层）
# 三 suite 合并切闭包，机制同 tiger（见 buildkit docs/srcdata.md）。
DID=v3.1
DISPLAY_NAME="方德桌面 3.1（cdos）"
IMAGE=fangde-v3.1
FAMILY=deb
METHOD=selfhost

SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:nfsdesktop-3.1-20220128-amd64"
SRCDATA_MANIFEST_SHA256="f7270313e7a671092a120b05920b6b71de96b576c0124eb943628c0b2e2f6dd2"
MEDIA_DIR=fd31-amd64
MIRROR=file:///w/media/fd31-amd64
NO_CHECK_GPG=yes

# 厂商 dists 代号 pub/nfs，合并介质记 stretch 以匹配 debootstrap 年代分支
SUITE=stretch
COMPONENTS=main
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/stretch
USRMERGE=no

# disk-scheduler-setting 被厂商标成 required，postinst 调容器里不存在的工具
# （exit 127），且调磁盘调度器本来就是内核态的事，容器里无意义。
PIN_NEVER="disk-scheduler-setting"
STAGE1_TOUCH="etc/apt/apt.conf"

STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
# libxtables12 必须显式点名：厂商重打的 iproute2 4.9.0-1.rb2 把这条
# Depends 丢了，但 m_xt.so 还在链它 —— 不点名镜像会带悬空 ELF 依赖（实测）
BASE_INCLUDE="iproute2,libxtables12,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++-6-dev,binutils,dpkg-dev"

# 基线：libc6 2.24-17+1nfs1；gcc-6 6.2.1 → libstdc++.so.6.0.22（GLIBCXX ≤ 3.4.22）
EXPECT_GLIBC=2.24
EXPECT_LIBSTDCPP=6.0.22
EXPECT_GLIBCXX=3.4.22
EXPECT_CXX=yes
EXPECT_SHADOW=0:42/640

# nfs suite Release 的 Date（2022-01-28），与数据镜像 .epoch 同源
SOURCE_DATE_EPOCH=1643361545
