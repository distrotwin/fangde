# 方德桌面 panda 代 —— Debian 10 (bullseye 前代 buster) 系，glibc 2.28 档 ABI
#
# suite 拓扑如实记：通用 panda 是厂商覆盖层（1905 包，无 libc6/dpkg，不自洽），
# 它的 panda-upstream 索引是空目录；完整 buster 上游存在于设备线
# （amd64 取 panda-0830-g120-upstream，arm64 取 panda-kylin990-upstream），
# security 同线。合并时厂商覆盖层按版本正常胜出（bash/binutils 等 +m*+*nfs4）。
# 2022-11 停更。
DID=panda
DISPLAY_NAME="方德桌面 panda 代"
IMAGE=fangde-panda
FAMILY=deb
METHOD=selfhost

case $ARCH in
  amd64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:nfsdesktop-panda-20221124-amd64"
    SRCDATA_MANIFEST_SHA256="27a82e765d66caf75e092b0734145a42f86ddaf4172f0a0547a32536c403bedf"
    MEDIA_DIR=pd-amd64
    ;;
  arm64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:nfsdesktop-panda-20221124-arm64"
    SRCDATA_MANIFEST_SHA256="8764e176b4043dae58aa8366d543b18caa92c994595ef9d40c737e65816b9add"
    MEDIA_DIR=pd-arm64
    ;;
esac
MIRROR=file:///w/media/$MEDIA_DIR
NO_CHECK_GPG=yes

SUITE=buster
COMPONENTS=main
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/buster
USRMERGE=no

# 厂商 libpam-modules 的 postinst 直接 sed /etc/pam.d/common-*，裸自举时它们
# 不存在（那本该由 libpam-runtime 的 pam-auth-update 生成）。注意不能预置
# 空文件：空 pam 配置等于 deny-all，chfn 被 PAM 拒、adduser 挂、systemd 的
# postinst 连锁死（实测）。assets/pam.d/ 里是 buster pam-auth-update 对
# unix profile 的规范输出，由 STAGE1_COPY 注入。
PIN_NEVER=""
STAGE1_TOUCH="etc/apt/apt.conf"
STAGE1_COPY="assets/pam.d/common-auth:etc/pam.d/common-auth assets/pam.d/common-account:etc/pam.d/common-account assets/pam.d/common-session:etc/pam.d/common-session assets/pam.d/common-password:etc/pam.d/common-password assets/pam.d/common-session-noninteractive:etc/pam.d/common-session-noninteractive"

STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
BASE_INCLUDE="iproute2,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++-8-dev,binutils,dpkg-dev"

# 基线：libc6 2.28-11+m3+1nfs4；gcc-8.3 → libstdc++.so.6.0.25（GLIBCXX ≤ 3.4.25）
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25
EXPECT_CXX=yes
EXPECT_SHADOW=0:42/640

# panda suite Release 的 Date（2022-11-24），与数据镜像 .epoch 同源
SOURCE_DATE_EPOCH=1669225040
