# 方德桌面操作系统 tiger 线 —— Debian 11 (bullseye) 系，glibc 2.31 档 ABI
#
# 版本命名如实：厂商 os-release 自述 "Debian NFSDesktop 11 (bullseye)"，公开源
# 的产品线代号是 tiger（前代 panda=3.1、cheetah=服务器线）。tiger 对应哪个市场
# 版本号（4.0/5.0）没有公开可验的依据，所以 DID 与 tag 用代号不用猜的数字。
#
# 取材走数据镜像：方德的两台源主机（updates.os / repos.os+update.os）对 GitHub
# hosted runner 全量 135 秒超时（官网同 runner 1.7s 通，判据见 buildkit
# docs/downstream-repo.md）。介质在本机从 repos.os 的 tiger + tiger-security +
# tiger-upstream 三 suite 合并切出（同名包取版本最高者），逐文件对过厂商索引的
# SHA256 后推成数据镜像。
#
# 两个如实标注：①厂商包有签名但公钥不可得（nfs-gpg-keys 里装的是 Oracle 公钥
# 和 OBS 默认无口令 key，厂商自己的 repo 就写 gpgcheck=0），完整性锚点是厂商
# 索引指纹链，不是签名；②厂商把 425 MB 的 360 浏览器标成 Priority:required，
# 构建镜像不该带浏览器，用 PIN_NEVER 从入口拦掉。
DID=tiger
DISPLAY_NAME="方德桌面操作系统（tiger 线）"
IMAGE=fangde-tiger
FAMILY=deb
METHOD=selfhost                   # 厂商 libcrypt1 依赖 libssl1.1，形成
                                  # libssl1.1→debconf→perl-base→libcrypt1 环，
                                  # apt 的 immediate-configure 拆不开（mmdebstrap
                                  # 实测两种配置都失败），dpkg 能拆 —— 走 debootstrap。

case $ARCH in
  amd64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:nfsdesktop-11-20251011-amd64"
    SRCDATA_MANIFEST_SHA256="a04597b2f5a19a8689aad7cfddcc333acd71578baa5076d29ca97662857dc17b"
    MEDIA_DIR=fd-amd64
    ;;
  arm64)
    SRCDATA_IMAGE="ghcr.io/distrotwin/scratch:nfsdesktop-11-20251011-arm64"
    SRCDATA_MANIFEST_SHA256="c399bd62aaf7e44429a6af7bb98ce0b2f2db23222861ccbea408c4d711c2f635"
    MEDIA_DIR=fd-arm64
    ;;
esac
MIRROR=file:///w/media/$MEDIA_DIR
NO_CHECK_GPG=yes                  # 合并介质由我们生成、无签名；完整性由厂商索引
                                  # SHA256 链 + 数据镜像 manifest 两道门禁兜底

# 介质里 dists 代号记 bullseye（厂商原代号 base 不在 debootstrap 的年代白名单，
# 会被当成 bookworm+ 而强求 usr-is-merged 包），改名依据记录在介质 .origin
SUITE=bullseye
COMPONENTS=main
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/bullseye
USRMERGE=no

PIN_NEVER="360epp"

# 厂商 apt 的 postinst 直接 sed /etc/apt/apt.conf，裸自举时它不存在 → exit 2。
# stage2 前预置为空文件（实测由此打通）。
STAGE1_TOUCH="etc/apt/apt.conf"

STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc-s1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
BASE_INCLUDE="iproute2,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++-10-dev,binutils,dpkg-dev"

# 基线为实测：glibc 2.31-13+deb11u3+m3+1nfs5，libstdc++.so.6.0.28（gcc-10 档）
EXPECT_GLIBC=2.31
EXPECT_LIBSTDCPP=6.0.28
EXPECT_GLIBCXX=3.4.28
EXPECT_CXX=yes
EXPECT_SHADOW=0:42/640

# tiger 主线 dists/base/Release 的 Date（2025-10-11），与数据镜像 .epoch 同源
SOURCE_DATE_EPOCH=1760123418
